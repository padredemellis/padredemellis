<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="Contacto — Hablemos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Contacto — Hablemos</title>
<style>
@font-face{font-family:'DMM';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'PF';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'OUT';src:url(data:font/woff2;base64,) format('woff2');}

.fade{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

.edge{transform-origin:left;transform:scaleX(0);animation:edge 1.4s .2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes edge{to{transform:scaleX(1)}}.glow{animation:pulse 6s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.55}to{opacity:1}}
</style>
<defs><linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#c8f06b"/><stop offset="1" stop-color="#6bf0c8"/></linearGradient><clipPath id="r"><rect width="840" height="190" rx="18"/></clipPath><radialGradient id="glow" cx="420.0" cy="220" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8f06b" stop-opacity=".16"/><stop offset="1" stop-color="#c8f06b" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#r)"><rect width="840" height="190" fill="#0d0d0f"/><rect width="840" height="190" fill="url(#glow)" class="glow"/><rect width="840" height="2" fill="url(#edge)" class="edge"/></g>
<rect x=".5" y=".5" width="839" height="189" rx="17.5" fill="none" stroke="#2a2a32"/>
<text x="420.0" y="66.0" font-family="DMM" font-size="12" fill="#c8f06b" text-anchor="middle" letter-spacing="2.4" class="fade d1">05 — CONTACTO</text>
<text x="420.0" y="122.0" font-family="PF" font-size="46" fill="#e8e8ec" text-anchor="middle" class="fade d2">Hablemos.</text>
<text x="420.0" y="158.0" font-family="OUT" font-size="17" fill="#8a8a9a" text-anchor="middle" class="fade d3">¿Tenés un proyecto en mente o querés colaborar? Escribime.</text>
</svg>